<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 110" width="100%" height="100%">
  <defs>
    <linearGradient id="playerBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a0e1a" />
      <stop offset="50%" stop-color="#0e1322" />
      <stop offset="100%" stop-color="#0a0e1a" />
    </linearGradient>

    <linearGradient id="eqGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#7928CA" />
      <stop offset="100%" stop-color="#FF0080" />
    </linearGradient>

    <linearGradient id="playerBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#7928CA" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FF0080" stop-opacity="0.5" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes eqJump1 { 0%, 100% { height: 6px; y: 28px; } 50% { height: 32px; y: 2px; } }
    @keyframes eqJump2 { 0%, 100% { height: 18px; y: 16px; } 50% { height: 36px; y: -2px; } }
    @keyframes eqJump3 { 0%, 100% { height: 10px; y: 24px; } 50% { height: 28px; y: 6px; } }
    @keyframes eqJump4 { 0%, 100% { height: 26px; y: 8px; } 50% { height: 12px; y: 22px; } }
    @keyframes eqJump5 { 0%, 100% { height: 14px; y: 20px; } 50% { height: 34px; y: 0px; } }
    @keyframes blinkLed { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    .eq1 { animation: eqJump1 1.2s ease-in-out infinite; }
    .eq2 { animation: eqJump2 0.9s ease-in-out infinite 0.2s; }
    .eq3 { animation: eqJump3 1.4s ease-in-out infinite 0.1s; }
    .eq4 { animation: eqJump4 1.1s ease-in-out infinite 0.3s; }
    .eq5 { animation: eqJump5 0.8s ease-in-out infinite 0.15s; }
    .pulse-rec { animation: blinkLed 1.2s infinite ease-in-out; }

    .player-font {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .mono-font {
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
  </style>

  <!-- Player Shell -->
  <rect width="1200" height="110" rx="12" fill="url(#playerBg)" />
  <rect x="1" y="1" width="1198" height="108" rx="11" fill="none" stroke="url(#playerBorder)" stroke-width="1.2" />

  <!-- Left Side: Music Disc / Play Icon -->
  <g transform="translate(45, 55)">
    <!-- Vinyl Disc Body -->
    <circle cx="0" cy="0" r="30" fill="#05070d" stroke="#1f293d" stroke-width="2" />
    <circle cx="0" cy="0" r="22" fill="none" stroke="#26354d" stroke-width="1" stroke-dasharray="3 3" />
    <circle cx="0" cy="0" r="14" fill="none" stroke="#334155" stroke-width="1" />
    <!-- Center Glow -->
    <circle cx="0" cy="0" r="6" fill="#00F2FE" filter="url(#glow)" />

    <!-- Play Triangle -->
    <polygon points="-2,-5 5,0 -2,5" fill="#080C14" />
  </g>

  <!-- Middle: Track Info & Status -->
  <g transform="translate(100, 38)">
    <!-- Live Mode Badge -->
    <g transform="translate(0, -6)">
      <circle cx="4" cy="4" r="4" fill="#EF4444" class="pulse-rec" />
      <text x="16" y="8" fill="#EF4444" font-size="10" font-weight="700" class="mono-font" letter-spacing="1">DEV FLOW STATE // 142 BPM SYNTHWAVE</text>
    </g>

    <!-- Main Song / Work Title -->
    <text x="0" y="30" fill="#F8FAFC" font-size="17" font-weight="700" class="player-font" letter-spacing="0.5">
      Building Resilient Systems, Autonomous Security &amp; Rust Tooling
    </text>

    <!-- Subtitle / Artist -->
    <text x="0" y="50" fill="#64748B" font-size="12" font-weight="500" class="mono-font">
      Mridul Singhal • Next.js 15 • Three.js • Tokio Async • High Reliability
    </text>
  </g>

  <!-- Right: Dynamic Animated Sound Equalizer -->
  <g transform="translate(940, 40)" fill="url(#eqGradient)" filter="url(#glow)">
    <rect x="0" y="16" width="6" height="18" rx="3" class="eq1" />
    <rect x="12" y="10" width="6" height="24" rx="3" class="eq2" />
    <rect x="24" y="6" width="6" height="28" rx="3" class="eq3" />
    <rect x="36" y="18" width="6" height="16" rx="3" class="eq4" />
    <rect x="48" y="4" width="6" height="30" rx="3" class="eq5" />
    <rect x="60" y="14" width="6" height="20" rx="3" class="eq2" />
    <rect x="72" y="2" width="6" height="32" rx="3" class="eq1" />
    <rect x="84" y="8" width="6" height="26" rx="3" class="eq3" />
    <rect x="96" y="20" width="6" height="14" rx="3" class="eq4" />
    <rect x="108" y="10" width="6" height="24" rx="3" class="eq5" />
    <rect x="120" y="4" width="6" height="30" rx="3" class="eq2" />
    <rect x="132" y="16" width="6" height="18" rx="3" class="eq1" />
  </g>

  <!-- Right Timer / Counter -->
  <g transform="translate(1110, 58)">
    <text x="0" y="0" text-anchor="middle" fill="#38BDF8" font-size="12" font-weight="700" class="mono-font">LIVE</text>
    <text x="0" y="16" text-anchor="middle" fill="#64748B" font-size="10" class="mono-font">∞</text>
  </g>
</svg>
