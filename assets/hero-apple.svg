<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Apple Studio Spotlight Gradient -->
    <radialGradient id="stageSpotlight" cx="50%" cy="25%" r="70%">
      <stop offset="0%" stop-color="#242220" stop-opacity="0.85" />
      <stop offset="45%" stop-color="#141312" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#080808" />
    </radialGradient>

    <!-- Warm Titanium Gradient for Keynote Typography -->
    <linearGradient id="titaniumText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#F5F5F7" />
      <stop offset="70%" stop-color="#E8DFD8" />
      <stop offset="100%" stop-color="#D4C5B9" />
    </linearGradient>

    <!-- Subtle Hairline Border -->
    <linearGradient id="hairlineBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A3835" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#222120" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#3A3835" stop-opacity="0.8" />
    </linearGradient>

    <!-- Subtle Warm Shimmer -->
    <linearGradient id="sandShimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4C5B9" stop-opacity="0" />
      <stop offset="50%" stop-color="#EDE8E3" stop-opacity="0.9">
        <animate attributeName="stop-opacity" values="0.3;0.9;0.3" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#D4C5B9" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    @keyframes subtleBreathe {
      0%, 100% { opacity: 0.95; transform: scale(1); }
      50% { opacity: 0.55; transform: scale(0.92); }
    }
    @keyframes softGleam {
      0%, 100% { opacity: 0.15; }
      50% { opacity: 0.35; }
    }

    .apple-led {
      animation: subtleBreathe 3.5s ease-in-out infinite;
      transform-origin: 32px 18px;
    }
    .grid-gleam {
      animation: softGleam 6s ease-in-out infinite;
    }

    .sf-display {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro", "Helvetica Neue", Arial, sans-serif;
    }
    .sf-mono {
      font-family: "SF Mono", ui-monospace, Menlo, Monaco, Consolas, monospace;
    }
  </style>

  <!-- Canvas Backdrop -->
  <rect width="1200" height="320" rx="16" fill="#080808" />
  <rect width="1200" height="320" rx="16" fill="url(#stageSpotlight)" />

  <!-- Ultra-Subtle Precision Architecture Grid (Apple Schematics) -->
  <g stroke="#1A1918" stroke-width="0.75" class="grid-gleam">
    <line x1="80" y1="0" x2="80" y2="320" />
    <line x1="1120" y1="0" x2="1120" y2="320" />
    <line x1="0" y1="260" x2="1200" y2="260" />
  </g>

  <!-- Border Frame -->
  <rect x="1" y="1" width="1198" height="318" rx="15" fill="none" stroke="url(#hairlineBorder)" stroke-width="1.2" />

  <!-- Top Status Badge -->
  <g transform="translate(80, 42)">
    <rect width="320" height="32" rx="16" fill="#141312" stroke="#2C2A28" stroke-width="1" />
    <!-- Apple Breathing Indicator -->
    <circle cx="20" cy="16" r="4" fill="#D4C5B9" class="apple-led" />
    <text x="36" y="20.5" fill="#A1A1A6" font-size="11.5" font-weight="600" class="sf-mono" letter-spacing="1.2">MRIDUL SINGHAL</text>
    <text x="180" y="20.5" fill="#636366" font-size="11.5" class="sf-mono">|</text>
    <text x="195" y="20.5" fill="#D4C5B9" font-size="11" font-weight="600" class="sf-mono" letter-spacing="0.8">SYSTEMS &amp; CORE</text>
  </g>

  <!-- Location & Availability (Top Right) -->
  <g transform="translate(870, 42)">
    <text x="250" y="20.5" text-anchor="end" fill="#8E8E93" font-size="11.5" font-weight="500" class="sf-mono" letter-spacing="1">
      NEW DELHI, INDIA • AVAILABLE WORLDWIDE
    </text>
  </g>

  <!-- Keynote Headline -->
  <g transform="translate(80, 142)">
    <text x="0" y="0" fill="url(#titaniumText)" font-size="50" font-weight="800" class="sf-display" letter-spacing="-1.5">
      Engineered for scale.
    </text>
    <text x="0" y="52" fill="#8E8E93" font-size="50" font-weight="700" class="sf-display" letter-spacing="-1.5">
      Architected for precision.
    </text>
  </g>

  <!-- Subtitle Paragraph -->
  <g transform="translate(82, 230)">
    <text x="0" y="0" fill="#A1A1A6" font-size="15" font-weight="400" class="sf-display" letter-spacing="-0.2">
      Full-Stack Engineer &amp; Systems Architect specializing in distributed observability platforms,
      <tspan fill="#F5F5F7" font-weight="600"> sub-50ms Rust runtimes</tspan>, and spatial web computing.
    </text>
  </g>

  <!-- Bottom Spec Strip Indicators -->
  <g transform="translate(80, 280)">
    <!-- Spec 1 -->
    <text x="0" y="14" fill="#636366" font-size="10.5" font-weight="600" class="sf-mono" letter-spacing="1">THROUGHPUT</text>
    <text x="105" y="14" fill="#E8DFD8" font-size="11.5" font-weight="700" class="sf-mono">50M+ EVENTS/DAY</text>
    <text x="250" y="14" fill="#3A3835" class="sf-mono">|</text>

    <!-- Spec 2 -->
    <text x="280" y="14" fill="#636366" font-size="10.5" font-weight="600" class="sf-mono" letter-spacing="1">RUNTIME</text>
    <text x="360" y="14" fill="#E8DFD8" font-size="11.5" font-weight="700" class="sf-mono">&lt;50MS RUST CORE</text>
    <text x="500" y="14" fill="#3A3835" class="sf-mono">|</text>

    <!-- Spec 3 -->
    <text x="530" y="14" fill="#636366" font-size="10.5" font-weight="600" class="sf-mono" letter-spacing="1">STACK</text>
    <text x="595" y="14" fill="#E8DFD8" font-size="11.5" font-weight="700" class="sf-mono">NEXT.JS 15 • THREE.JS • TOKIO</text>
    <text x="825" y="14" fill="#3A3835" class="sf-mono">|</text>

    <!-- Spec 4 -->
    <text x="855" y="14" fill="#636366" font-size="10.5" font-weight="600" class="sf-mono" letter-spacing="1">SLA</text>
    <text x="895" y="14" fill="#E8DFD8" font-size="11.5" font-weight="700" class="sf-mono">99.95% AVAILABILITY</text>
  </g>
</svg>
