<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="sysBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="50%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#060910" />
    </linearGradient>

    <linearGradient id="sysBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#7928CA" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FF0080" stop-opacity="0.5" />
    </linearGradient>

    <!-- Node Glow Filters -->
    <filter id="nodeGlowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="nodeGlowPurple" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Flow Line Gradients -->
    <linearGradient id="flowCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="flowPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#A78BFA" />
    </linearGradient>
    <linearGradient id="flowPink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#FF0080" />
    </linearGradient>
  </defs>

  <style>
    @keyframes dashStream {
      from { stroke-dashoffset: 48; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes pulseNode {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.04); opacity: 1; }
    }
    @keyframes beaconBlink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.8); }
    }

    .data-wire {
      stroke-dasharray: 6 6;
      animation: dashStream 1.5s linear infinite;
    }
    .data-wire-fast {
      stroke-dasharray: 4 4;
      animation: dashStream 0.9s linear infinite;
    }
    .node-box {
      transition: all 0.3s ease;
    }
    .beacon {
      animation: beaconBlink 1.8s infinite ease-in-out;
      transform-box: fill-box;
      transform-origin: center;
    }

    .sys-title {
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
    }
    .node-header {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 12.5px;
      font-weight: 700;
    }
    .node-sub {
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 10px;
      font-weight: 500;
    }
  </style>

  <!-- Container Base -->
  <rect width="1000" height="320" rx="14" fill="url(#sysBg)" />
  <rect x="1" y="1" width="998" height="318" rx="13" fill="none" stroke="url(#sysBorder)" stroke-width="1.2" />

  <!-- Top Bar -->
  <path d="M 1 36 L 999 36" stroke="#1e293b" stroke-width="1" />
  <g transform="translate(25, 23)">
    <circle cx="0" cy="0" r="4.5" fill="#00F2FE" class="beacon" filter="url(#nodeGlowCyan)" />
    <text x="14" y="4" fill="#00F2FE" class="sys-title">SYSTEM ARCHITECTURE: END-TO-END EVENT FLOW</text>
  </g>
  <g transform="translate(730, 23)">
    <text x="0" y="4" fill="#64748B" class="sys-title">PIPELINE THROUGHPUT : <tspan fill="#10B981">&gt; 50M EVT/DAY</tspan></text>
  </g>

  <!-- Connection Lines (Data Stream Wires) -->
  <!-- Wire 1: Client -> Gateway -->
  <line x1="160" y1="170" x2="270" y2="170" stroke="#00F2FE" stroke-width="2" class="data-wire-fast" />

  <!-- Wire 2: Gateway -> Rust Engine (Up) -->
  <path d="M 370 150 L 410 110 L 460 110" fill="none" stroke="#38BDF8" stroke-width="2" class="data-wire" />

  <!-- Wire 3: Gateway -> Redis / Cache (Down) -->
  <path d="M 370 190 L 410 230 L 460 230" fill="none" stroke="#818CF8" stroke-width="2" class="data-wire" />

  <!-- Wire 4: Rust Engine -> Distributed DB -->
  <line x1="580" y1="110" x2="680" y2="110" stroke="#A78BFA" stroke-width="2" class="data-wire-fast" />

  <!-- Wire 5: Rust Engine -> MAS AI Security -->
  <path d="M 570 135 L 610 170 L 680 215" fill="none" stroke="#F472B6" stroke-width="1.8" class="data-wire" />

  <!-- Wire 6: Redis Cache -> MAS AI Security -->
  <line x1="580" y1="230" x2="680" y2="230" stroke="#C084FC" stroke-width="2" class="data-wire" />

  <!-- Wire 7: Distributed DB -> Observability -->
  <path d="M 790 110 L 830 150 L 860 155" fill="none" stroke="#F472B6" stroke-width="2" class="data-wire-fast" />

  <!-- Wire 8: MAS AI -> Observability -->
  <path d="M 790 230 L 830 190 L 860 185" fill="none" stroke="#FF0080" stroke-width="2" class="data-wire-fast" />

  <!-- ==================== SYSTEM NODES ==================== -->

  <!-- Node 1: Client Layer (Left) -->
  <g transform="translate(40, 135)" class="node-box">
    <rect width="130" height="70" rx="10" fill="#0c1929" stroke="#0284c7" stroke-width="1.5" />
    <circle cx="20" cy="24" r="5" fill="#38BDF8" class="beacon" />
    <text x="32" y="28" fill="#F0F9FF" class="node-header">Next.js 15 / 3D</text>
    <text x="14" y="46" fill="#7DD3FC" class="node-sub">Edge App Router</text>
    <text x="14" y="60" fill="#64748B" class="node-sub">Sub-10ms UI</text>
  </g>

  <!-- Node 2: Gateway & Production Safety Guard -->
  <g transform="translate(250, 135)" class="node-box">
    <rect width="130" height="70" rx="10" fill="#131b2e" stroke="#00F2FE" stroke-width="1.5" filter="url(#nodeGlowCyan)" />
    <circle cx="20" cy="24" r="5" fill="#00F2FE" class="beacon" />
    <text x="32" y="28" fill="#FFFFFF" class="node-header">API Gateway</text>
    <text x="14" y="46" fill="#38BDF8" class="node-sub">Env Safety Guard</text>
    <text x="14" y="60" fill="#64748B" class="node-sub">Rate &amp; Auth Limit</text>
  </g>

  <!-- Node 3: Rust Core Engine (Top Middle) -->
  <g transform="translate(450, 75)" class="node-box">
    <rect width="140" height="70" rx="10" fill="#181329" stroke="#8B5CF6" stroke-width="1.5" />
    <circle cx="20" cy="24" r="5" fill="#A78BFA" class="beacon" />
    <text x="32" y="28" fill="#F5F3FF" class="node-header">Rust Core Runtime</text>
    <text x="14" y="46" fill="#C4B5FD" class="node-sub">Tokio Async Multi-Th</text>
    <text x="14" y="60" fill="#10B981" class="node-sub">&lt; 50ms Prompt / 5MB</text>
  </g>

  <!-- Node 4: Cache & Stream Bus (Bottom Middle) -->
  <g transform="translate(450, 195)" class="node-box">
    <rect width="140" height="70" rx="10" fill="#1e1026" stroke="#C026D3" stroke-width="1.5" />
    <circle cx="20" cy="24" r="5" fill="#E879F9" class="beacon" />
    <text x="32" y="28" fill="#FDF4FF" class="node-header">Redis &amp; State Bus</text>
    <text x="14" y="46" fill="#F0ABFC" class="node-sub">Pub/Sub In-Memory</text>
    <text x="14" y="60" fill="#64748B" class="node-sub">Zero Inconsistency</text>
  </g>

  <!-- Node 5: Distributed Storage (Top Right) -->
  <g transform="translate(670, 75)" class="node-box">
    <rect width="135" height="70" rx="10" fill="#19172e" stroke="#6366F1" stroke-width="1.5" />
    <circle cx="20" cy="24" r="5" fill="#818CF8" class="beacon" />
    <text x="32" y="28" fill="#EEF2FF" class="node-header">Postgres / Mongo</text>
    <text x="14" y="46" fill="#A5B4FC" class="node-sub">Timescale / Sharding</text>
    <text x="14" y="60" fill="#64748B" class="node-sub">ACID Guaranteed</text>
  </g>

  <!-- Node 6: M.A.S. AI Swarm (Bottom Right) -->
  <g transform="translate(670, 195)" class="node-box">
    <rect width="135" height="70" rx="10" fill="#240c1e" stroke="#EC4899" stroke-width="1.5" filter="url(#nodeGlowPurple)" />
    <circle cx="20" cy="24" r="5" fill="#F472B6" class="beacon" />
    <text x="32" y="28" fill="#FDF2F8" class="node-header">M.A.S. AI Swarm</text>
    <text x="14" y="46" fill="#F472B6" class="node-sub">10+ Security Agents</text>
    <text x="14" y="60" fill="#10B981" class="node-sub">Adaptive Defense</text>
  </g>

  <!-- Node 7: Observability / Splunk Layer (Far Right) -->
  <g transform="translate(850, 135)" class="node-box">
    <rect width="125" height="70" rx="10" fill="#210a1b" stroke="#FF0080" stroke-width="1.8" />
    <circle cx="20" cy="24" r="5" fill="#FF0080" class="beacon" />
    <text x="32" y="28" fill="#FFF1F2" class="node-header">Splunk &amp; Metrics</text>
    <text x="14" y="46" fill="#FDA4AF" class="node-sub">50M+ Events/Day</text>
    <text x="14" y="60" fill="#10B981" class="node-sub">MTTR Cut by 60%</text>
  </g>

  <!-- Bottom Legend Bar -->
  <path d="M 1 285 L 999 285" stroke="#1e293b" stroke-width="1" />
  <g transform="translate(40, 303)">
    <text x="0" y="0" fill="#64748B" class="sys-title">
      ARCHITECTURE PRINCIPLES : 
      <tspan fill="#38BDF8"> ZERO-COST ABSTRACTIONS </tspan> •
      <tspan fill="#A78BFA"> EVENT IDEMPOTENCY </tspan> •
      <tspan fill="#F472B6"> FAIL-SAFE DEGRADATION </tspan> •
      <tspan fill="#10B981"> RUNTIME BENCHMARKS </tspan>
    </text>
  </g>
</svg>
