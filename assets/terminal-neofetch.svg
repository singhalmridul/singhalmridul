<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 360" width="100%" height="100%">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="50%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#050810" />
    </linearGradient>

    <linearGradient id="termBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#7928CA" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FF0080" stop-opacity="0.5" />
    </linearGradient>

    <filter id="termGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes blinkCursor {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes pulseAscii {
      0%, 100% { opacity: 0.8; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.02); }
    }
    .cursor-blink {
      animation: blinkCursor 1s step-end infinite;
    }
    .ascii-art {
      animation: pulseAscii 4s ease-in-out infinite;
      transform-origin: 140px 180px;
    }
    .term-code {
      font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, monospace;
      font-size: 12.5px;
    }
    .term-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 11px;
      font-weight: 600;
    }
  </style>

  <!-- Terminal Window Base -->
  <rect width="950" height="360" rx="14" fill="url(#termBg)" />
  <rect x="1" y="1" width="948" height="358" rx="13" fill="none" stroke="url(#termBorder)" stroke-width="1.2" />

  <!-- Mac Titlebar Header -->
  <path d="M 1 38 L 949 38" stroke="#1e293b" stroke-width="1" />
  
  <!-- Window Controls (Red, Yellow, Green) -->
  <circle cx="24" cy="19" r="6" fill="#EF4444" />
  <circle cx="44" cy="19" r="6" fill="#F59E0B" />
  <circle cx="64" cy="19" r="6" fill="#10B981" />

  <!-- Center Window Title -->
  <text x="475" y="23" text-anchor="middle" fill="#94A3B8" class="term-title">mridul@spatial-kernel: ~ (zsh / masterm-rust)</text>

  <!-- Execution Prompt -->
  <g transform="translate(35, 68)">
    <text x="0" y="0" fill="#10B981" font-weight="700" class="term-code">mridul@cortex-mainframe</text>
    <text x="185" y="0" fill="#64748B" font-weight="600" class="term-code">:</text>
    <text x="198" y="0" fill="#38BDF8" font-weight="700" class="term-code">~</text>
    <text x="215" y="0" fill="#E2E8F0" font-weight="600" class="term-code">$ neofetch --architect</text>
  </g>

  <!-- Left: Glowing ASCII Cube / Holographic Architecture Symbol -->
  <g transform="translate(45, 105)" class="ascii-art">
    <text x="0" y="20" fill="#00F2FE" font-family="ui-monospace, monospace" font-size="11" font-weight="800" filter="url(#termGlow)">
      <tspan x="0" dy="0">       /\________/\       </tspan>
      <tspan x="0" dy="16">      /  \      /  \      </tspan>
      <tspan x="0" dy="16">     / /\ \____/ /\ \     </tspan>
      <tspan x="0" dy="16">    / /  \ \  / /  \ \    </tspan>
      <tspan x="0" dy="16">   / /    \ \/ /    \ \   </tspan>
      <tspan x="0" dy="16">   \/______\/__\_____\/   </tspan>
      <tspan x="0" dy="16">   /\      /\  /\    /\   </tspan>
      <tspan x="0" dy="16">  /  \____/  \/  \__/  \  </tspan>
      <tspan x="0" dy="16">  \  /    \  /\  /  \  /  </tspan>
      <tspan x="0" dy="16">   \/______\/__\/____\/   </tspan>
    </text>
    <text x="12" y="205" fill="#38BDF8" font-family="ui-monospace, monospace" font-size="9" font-weight="700" letter-spacing="1">
      [CORTEX DISTRIBUTED CORE]
    </text>
  </g>

  <!-- Right: Neofetch System Output -->
  <g transform="translate(320, 105)">
    <!-- User Banner -->
    <text x="0" y="15" fill="#00F2FE" font-weight="800" class="term-code">mridulsinghal@cortex-mainframe</text>
    <text x="0" y="28" fill="#334155" class="term-code">--------------------------------------------------</text>

    <!-- Info Lines -->
    <g transform="translate(0, 48)">
      <!-- Line 1 -->
      <text x="0" y="0" fill="#94A3B8" font-weight="600" class="term-code">Archetype:</text>
      <text x="130" y="0" fill="#F8FAFC" font-weight="700" class="term-code">Full-Stack Engineer &amp; Systems Architect</text>

      <!-- Line 2 -->
      <text x="0" y="22" fill="#94A3B8" font-weight="600" class="term-code">Experience:</text>
      <text x="130" y="22" fill="#38BDF8" font-weight="700" class="term-code">Michelin Distributed Platforms (50M+ Evt/Day)</text>

      <!-- Line 3 -->
      <text x="0" y="44" fill="#94A3B8" font-weight="600" class="term-code">Kernel &amp; Shell:</text>
      <text x="130" y="44" fill="#C084FC" font-weight="700" class="term-code">MASTerm (Rust Core, Tokio Async, &lt;50ms)</text>

      <!-- Line 4 -->
      <text x="0" y="66" fill="#94A3B8" font-weight="600" class="term-code">Autonomous AI:</text>
      <text x="130" y="66" fill="#FF0080" font-weight="700" class="term-code">M.A.S. AI Pentest Swarm (10+ Active Agents)</text>

      <!-- Line 5 -->
      <text x="0" y="88" fill="#94A3B8" font-weight="600" class="term-code">Spatial &amp; 3D Web:</text>
      <text x="130" y="88" fill="#2DD4BF" font-weight="700" class="term-code">Next.js 15 App Router • Three.js • Shaders</text>

      <!-- Line 6 -->
      <text x="0" y="110" fill="#94A3B8" font-weight="600" class="term-code">System Scale:</text>
      <text x="130" y="110" fill="#10B981" font-weight="700" class="term-code">MTTR -60% • 30 hrs/wk Automated • 99.95% Up</text>

      <!-- Line 7 -->
      <text x="0" y="132" fill="#94A3B8" font-weight="600" class="term-code">Coordinates:</text>
      <text x="130" y="132" fill="#E2E8F0" class="term-code">New Delhi, India [Open for Worldwide Missions]</text>
    </g>

    <!-- Color Palette Blocks -->
    <g transform="translate(0, 205)">
      <rect x="0" y="0" width="22" height="12" rx="3" fill="#00F2FE" />
      <rect x="28" y="0" width="22" height="12" rx="3" fill="#38BDF8" />
      <rect x="56" y="0" width="22" height="12" rx="3" fill="#818CF8" />
      <rect x="84" y="0" width="22" height="12" rx="3" fill="#A78BFA" />
      <rect x="112" y="0" width="22" height="12" rx="3" fill="#C084FC" />
      <rect x="140" y="0" width="22" height="12" rx="3" fill="#F472B6" />
      <rect x="168" y="0" width="22" height="12" rx="3" fill="#FF0080" />
      <rect x="196" y="0" width="22" height="12" rx="3" fill="#10B981" />
      <!-- Blinking Cursor -->
      <rect x="235" y="-1" width="8" height="14" fill="#00F2FE" class="cursor-blink" />
    </g>
  </g>
</svg>
