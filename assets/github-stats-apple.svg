<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 220" width="100%" height="100%">
  <defs>
    <linearGradient id="appleStatBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141416" />
      <stop offset="100%" stop-color="#0E0E10" />
    </linearGradient>

    <linearGradient id="appleStatBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#302E2B" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#201F1D" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#302E2B" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="barTitanium" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8E8E93" />
      <stop offset="100%" stop-color="#D4C5B9" />
    </linearGradient>

    <linearGradient id="barWarm" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#636366" />
      <stop offset="100%" stop-color="#A1A1A6" />
    </linearGradient>
  </defs>

  <style>
    @keyframes barAnim1 { 0% { width: 0px; } 100% { width: 250px; } }
    @keyframes barAnim2 { 0% { width: 0px; } 100% { width: 95px; } }
    @keyframes barAnim3 { 0% { width: 0px; } 100% { width: 52px; } }
    @keyframes barAnim4 { 0% { width: 0px; } 100% { width: 35px; } }

    .bar1 { animation: barAnim1 1.6s ease-out forwards; }
    .bar2 { animation: barAnim2 1.6s ease-out forwards; }
    .bar3 { animation: barAnim3 1.6s ease-out forwards; }
    .bar4 { animation: barAnim4 1.6s ease-out forwards; }

    .apple-stat-title {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      font-size: 13px;
      font-weight: 700;
      fill: #F5F5F7;
    }
    .apple-stat-val {
      font-family: "SF Mono", ui-monospace, Menlo, monospace;
      font-size: 22px;
      font-weight: 800;
      fill: #D4C5B9;
    }
    .apple-stat-sub {
      font-family: "SF Mono", ui-monospace, Menlo, monospace;
      font-size: 10.5px;
      font-weight: 500;
      fill: #8E8E93;
    }
  </style>

  <!-- Left Card: Verified GitHub Public Performance -->
  <g transform="translate(0, 0)">
    <rect width="535" height="220" rx="14" fill="url(#appleStatBg)" stroke="url(#appleStatBorder)" stroke-width="1" />
    
    <path d="M 0 38 L 535 38" stroke="#1E1E20" stroke-width="1" />
    <g transform="translate(30, 24)">
      <circle cx="0" cy="0" r="3.5" fill="#D4C5B9" />
      <text x="14" y="3.5" fill="#D4C5B9" font-family="'SF Mono', monospace" font-size="10.5" font-weight="700" letter-spacing="1.2">
        PUBLIC REPOSITORY METRICS
      </text>
    </g>

    <!-- Stat 1: Stars -->
    <g transform="translate(30, 65)">
      <text x="0" y="0" class="apple-stat-sub">TOTAL STARS EARNED</text>
      <text x="0" y="26" class="apple-stat-val">77</text>
      <text x="0" y="44" class="apple-stat-sub">Across open source repos</text>
    </g>

    <!-- Divider -->
    <line x1="200" y1="55" x2="200" y2="125" stroke="#222224" stroke-width="1" />

    <!-- Stat 2: Repos -->
    <g transform="translate(230, 65)">
      <text x="0" y="0" class="apple-stat-sub">PUBLIC REPOSITORIES</text>
      <text x="0" y="26" class="apple-stat-val">8</text>
      <text x="0" y="44" class="apple-stat-sub">Production systems</text>
    </g>

    <!-- Divider -->
    <line x1="380" y1="55" x2="380" y2="125" stroke="#222224" stroke-width="1" />

    <!-- Stat 3: Followers -->
    <g transform="translate(410, 65)">
      <text x="0" y="0" class="apple-stat-sub">COMMUNITY</text>
      <text x="0" y="26" class="apple-stat-val">34</text>
      <text x="0" y="44" class="apple-stat-sub">Engineers &amp; peers</text>
    </g>

    <!-- Bottom Status -->
    <path d="M 0 178 L 535 178" stroke="#1E1E20" stroke-width="1" />
    <g transform="translate(30, 200)">
      <text x="0" y="0" fill="#636366" font-family="'SF Mono', monospace" font-size="10" letter-spacing="0.8">
        SCOPE: <tspan fill="#A1A1A6">PUBLIC CODEBASES ONLY</tspan> • VERIFIED GITHUB API
      </text>
    </g>
  </g>

  <!-- Right Card: Codebase Distribution By Language -->
  <g transform="translate(565, 0)">
    <rect width="535" height="220" rx="14" fill="url(#appleStatBg)" stroke="url(#appleStatBorder)" stroke-width="1" />
    
    <path d="M 0 38 L 535 38" stroke="#1E1E20" stroke-width="1" />
    <g transform="translate(30, 24)">
      <circle cx="0" cy="0" r="3.5" fill="#8E8E93" />
      <text x="14" y="3.5" fill="#E5E5EA" font-family="'SF Mono', monospace" font-size="10.5" font-weight="700" letter-spacing="1.2">
        CODEBASE STACK DISTRIBUTION
      </text>
    </g>
    <g transform="translate(505, 24)">
      <text x="0" y="3.5" text-anchor="end" fill="#636366" font-family="'SF Mono', monospace" font-size="10">BY VOLUME</text>
    </g>

    <!-- Bar 1: TypeScript -->
    <g transform="translate(30, 62)">
      <text x="0" y="0" fill="#E5E5EA" font-size="11.5" font-family="'SF Mono', monospace" font-weight="600">TypeScript / Next.js</text>
      <text x="475" y="0" text-anchor="end" fill="#D4C5B9" font-family="'SF Mono', monospace" font-size="11.5" font-weight="700">58%</text>
      <rect x="0" y="8" width="475" height="5" rx="2.5" fill="#1C1C1E" />
      <rect x="0" y="8" width="275" height="5" rx="2.5" fill="url(#barTitanium)" class="bar1" />
    </g>

    <!-- Bar 2: Rust -->
    <g transform="translate(30, 96)">
      <text x="0" y="0" fill="#E5E5EA" font-size="11.5" font-family="'SF Mono', monospace" font-weight="600">Rust (MASTerm Runtime)</text>
      <text x="475" y="0" text-anchor="end" fill="#D4C5B9" font-family="'SF Mono', monospace" font-size="11.5" font-weight="700">22%</text>
      <rect x="0" y="8" width="475" height="5" rx="2.5" fill="#1C1C1E" />
      <rect x="0" y="8" width="105" height="5" rx="2.5" fill="url(#barWarm)" class="bar2" />
    </g>

    <!-- Bar 3: Python -->
    <g transform="translate(30, 130)">
      <text x="0" y="0" fill="#E5E5EA" font-size="11.5" font-family="'SF Mono', monospace" font-weight="600">Python (Automation &amp; AI)</text>
      <text x="475" y="0" text-anchor="end" fill="#D4C5B9" font-family="'SF Mono', monospace" font-size="11.5" font-weight="700">12%</text>
      <rect x="0" y="8" width="475" height="5" rx="2.5" fill="#1C1C1E" />
      <rect x="0" y="8" width="57" height="5" rx="2.5" fill="url(#barWarm)" class="bar3" />
    </g>

    <!-- Bar 4: Go & Shell -->
    <g transform="translate(30, 164)">
      <text x="0" y="0" fill="#E5E5EA" font-size="11.5" font-family="'SF Mono', monospace" font-weight="600">Go &amp; Systems Shell</text>
      <text x="475" y="0" text-anchor="end" fill="#D4C5B9" font-family="'SF Mono', monospace" font-size="11.5" font-weight="700">8%</text>
      <rect x="0" y="8" width="475" height="5" rx="2.5" fill="#1C1C1E" />
      <rect x="0" y="8" width="38" height="5" rx="2.5" fill="url(#barWarm)" class="bar4" />
    </g>
  </g>
</svg>
