<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow1" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="bgGlow2" cx="80%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#7928CA" stop-opacity="0.28" />
      <stop offset="60%" stop-color="#FF0080" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="radarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0" />
    </radialGradient>

    <!-- Animated Linear Gradient for Text -->
    <linearGradient id="cyberText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE">
        <animate attributeName="stop-color" values="#00F2FE;#4FACFE;#7928CA;#FF0080;#00F2FE" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#4FACFE">
        <animate attributeName="stop-color" values="#4FACFE;#7928CA;#FF0080;#00F2FE;#4FACFE" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#FF0080">
        <animate attributeName="stop-color" values="#FF0080;#00F2FE;#4FACFE;#7928CA;#FF0080" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.6">
        <animate attributeName="stop-opacity" values="0.6;0.2;0.8;0.6" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#7928CA" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FF0080" stop-opacity="0.7">
        <animate attributeName="stop-opacity" values="0.7;0.3;0.9;0.7" dur="4s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f293d" stroke-width="0.7" stroke-opacity="0.45" />
      <circle cx="40" cy="40" r="1" fill="#00F2FE" fill-opacity="0.3" />
    </pattern>

    <!-- Filter for Neon Glow -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseLed {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.85); }
    }
    @keyframes rotateClockwise {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes rotateCounter {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      50% { transform: translateY(-12px) translateX(6px); opacity: 0.8; }
    }
    @keyframes scanlineAnim {
      0% { transform: translateY(-50px); opacity: 0; }
      20% { opacity: 0.6; }
      80% { opacity: 0.6; }
      100% { transform: translateY(420px); opacity: 0; }
    }
    @keyframes wavePulse {
      0%, 100% { height: 16px; y: 284px; }
      50% { height: 38px; y: 262px; }
    }

    .status-led {
      animation: pulseLed 2s infinite ease-in-out;
      transform-origin: 75px 65px;
    }
    .radar-outer {
      animation: rotateClockwise 22s infinite linear;
      transform-box: fill-box;
      transform-origin: center;
    }
    .radar-inner {
      animation: rotateCounter 14s infinite linear;
      transform-box: fill-box;
      transform-origin: center;
    }
    .radar-core {
      animation: rotateClockwise 8s infinite linear;
      transform-box: fill-box;
      transform-origin: center;
    }
    .p1 { animation: floatParticle 5s infinite ease-in-out; }
    .p2 { animation: floatParticle 7s infinite ease-in-out 1.5s; }
    .p3 { animation: floatParticle 6s infinite ease-in-out 3s; }
    .p4 { animation: floatParticle 8s infinite ease-in-out 0.8s; }
    .scan-beam {
      animation: scanlineAnim 6s infinite ease-in-out;
    }

    .tech-font {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .mono-font {
      font-family: ui-monospace, "SF Mono", "Cascadia Code", "Source Code Pro", Menlo, Consolas, monospace;
    }
  </style>

  <!-- Deep Backdrop -->
  <rect width="1200" height="380" rx="16" fill="#080C14" />
  <rect width="1200" height="380" rx="16" fill="url(#bgGlow1)" />
  <rect width="1200" height="380" rx="16" fill="url(#bgGlow2)" />
  <rect width="1200" height="380" rx="16" fill="url(#cyberGrid)" />

  <!-- Outer Glassmorphic Border -->
  <rect x="2" y="2" width="1196" height="376" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="1.8" />

  <!-- Particle Constellation Nodes -->
  <g fill="#00F2FE" opacity="0.6">
    <circle cx="180" cy="90" r="2" class="p1" />
    <circle cx="340" cy="50" r="1.5" class="p2" />
    <circle cx="510" cy="110" r="2.5" class="p3" />
    <circle cx="680" cy="70" r="1.5" class="p4" />
    <circle cx="280" cy="320" r="2" class="p2" />
    <circle cx="490" cy="340" r="1.5" class="p1" />
    <circle cx="750" cy="310" r="2" class="p3" />
  </g>

  <!-- Top Status Bar Pill -->
  <g transform="translate(60, 48)">
    <rect width="360" height="34" rx="17" fill="#0e1726" stroke="#1f2d42" stroke-width="1.2" />
    <!-- Pulsing Green Status Dot -->
    <circle cx="24" cy="17" r="5" fill="#10B981" class="status-led" filter="url(#softGlow)" />
    <circle cx="24" cy="17" r="8" fill="#10B981" opacity="0.25" class="status-led" />
    <text x="42" y="22" fill="#E2E8F0" font-size="12" font-weight="600" class="mono-font" letter-spacing="1">SYSTEM STATUS : </text>
    <text x="175" y="22" fill="#10B981" font-size="12" font-weight="700" class="mono-font" letter-spacing="1.2">ONLINE // OPTIMAL</text>
  </g>

  <!-- Telemetry Badge (Top Right) -->
  <g transform="translate(730, 48)">
    <rect width="210" height="34" rx="17" fill="#0e1726" stroke="#2a1f4a" stroke-width="1.2" />
    <text x="24" y="22" fill="#A78BFA" font-size="12" font-weight="600" class="mono-font" letter-spacing="0.8">⚡ RUNTIME : </text>
    <text x="116" y="22" fill="#F472B6" font-size="12" font-weight="700" class="mono-font" letter-spacing="1">SUB-50MS</text>
  </g>

  <!-- Main Hero Title -->
  <g transform="translate(60, 155)">
    <text x="0" y="0" fill="url(#cyberText)" font-size="56" font-weight="900" class="tech-font" letter-spacing="3" filter="url(#neonGlow)">MRIDUL SINGHAL</text>
    <text x="0" y="0" fill="#FFFFFF" font-size="56" font-weight="900" class="tech-font" letter-spacing="3" opacity="0.95">MRIDUL SINGHAL</text>
  </g>

  <!-- Subtitle / Role -->
  <g transform="translate(62, 195)">
    <text x="0" y="0" fill="#94A3B8" font-size="20" font-weight="500" class="tech-font" letter-spacing="1.5">
      Full-Stack Engineer <tspan fill="#38BDF8">&amp;</tspan> Systems Architect
    </text>
  </g>

  <!-- Description / Core Mantra -->
  <g transform="translate(62, 230)">
    <text x="0" y="0" fill="#64748B" font-size="14.5" font-weight="400" class="tech-font">
      Architecting high-throughput distributed platforms • Sub-50ms CLI runtimes • Autonomous AI Security Agents
    </text>
  </g>

  <!-- Tech Focus Badges Bar -->
  <g transform="translate(60, 272)">
    <!-- Badge 1: Rust Systems -->
    <g transform="translate(0, 0)">
      <rect width="145" height="36" rx="10" fill="#0f172a" stroke="#0284c7" stroke-width="1" />
      <text x="18" y="23" fill="#38bdf8" font-size="12" font-weight="700" class="mono-font">🦀 RUST &amp; SYSTEMS</text>
    </g>
    <!-- Badge 2: AI Security -->
    <g transform="translate(157, 0)">
      <rect width="180" height="36" rx="10" fill="#150f28" stroke="#7c3aed" stroke-width="1" />
      <text x="18" y="23" fill="#c084fc" font-size="12" font-weight="700" class="mono-font">🛡️ MULTI-AGENT SEC</text>
    </g>
    <!-- Badge 3: 50M+ Scale -->
    <g transform="translate(349, 0)">
      <rect width="170" height="36" rx="10" fill="#1c0b1e" stroke="#db2777" stroke-width="1" />
      <text x="18" y="23" fill="#f472b6" font-size="12" font-weight="700" class="mono-font">📈 50M+ EVENTS/DAY</text>
    </g>
    <!-- Badge 4: Full Stack / 3D -->
    <g transform="translate(531, 0)">
      <rect width="170" height="36" rx="10" fill="#0c1d24" stroke="#0d9488" stroke-width="1" />
      <text x="18" y="23" fill="#2dd4bf" font-size="12" font-weight="700" class="mono-font">🌐 NEXT.JS 15 &amp; 3D</text>
    </g>
  </g>

  <!-- Right Side Interactive Hologram / Radar System -->
  <g transform="translate(1040, 190)">
    <!-- Radial Back Glow -->
    <circle cx="0" cy="0" r="130" fill="url(#radarGlow)" />

    <!-- Outer Targeting Ring -->
    <circle cx="0" cy="0" r="115" fill="none" stroke="#1e293b" stroke-width="2" />
    <circle cx="0" cy="0" r="115" fill="none" stroke="#00F2FE" stroke-width="2.5" stroke-dasharray="25 60 40 80" class="radar-outer" filter="url(#softGlow)" />

    <!-- Degree Ticks -->
    <g stroke="#334155" stroke-width="1.5">
      <line x1="0" y1="-122" x2="0" y2="-114" />
      <line x1="0" y1="114" x2="0" y2="122" />
      <line x1="-122" y1="0" x2="-114" y2="0" />
      <line x1="114" y1="0" x2="122" y2="0" />
      <line x1="-85" y1="-85" x2="-79" y2="-79" />
      <line x1="79" y1="79" x2="85" y2="85" />
      <line x1="85" y1="-85" x2="79" y2="-79" />
      <line x1="-79" y1="79" x2="-85" y2="85" />
    </g>

    <!-- Mid Holographic Hexagon -->
    <polygon points="0,-85 73.6,-42.5 73.6,42.5 0,85 -73.6,42.5 -73.6,-42.5" fill="none" stroke="#7928CA" stroke-width="1.8" stroke-dasharray="15 8" class="radar-inner" opacity="0.8" />

    <!-- Inner Orbit Ring -->
    <circle cx="0" cy="0" r="55" fill="none" stroke="#FF0080" stroke-width="1.8" stroke-dasharray="10 20" class="radar-core" opacity="0.9" />

    <!-- Core Target Crosshair -->
    <circle cx="0" cy="0" r="28" fill="#080C14" stroke="#00F2FE" stroke-width="1.5" />
    <circle cx="0" cy="0" r="8" fill="#00F2FE" filter="url(#softGlow)" />
    <line x1="-40" y1="0" x2="40" y2="0" stroke="#00F2FE" stroke-width="1" stroke-opacity="0.6" />
    <line x1="0" y1="-40" x2="0" y2="40" stroke="#00F2FE" stroke-width="1" stroke-opacity="0.6" />

    <!-- Orbital Planet / Particle Node -->
    <g class="radar-outer">
      <circle cx="115" cy="0" r="4.5" fill="#00F2FE" filter="url(#softGlow)" />
    </g>
    <g class="radar-inner">
      <circle cx="-55" cy="0" r="3.5" fill="#FF0080" filter="url(#softGlow)" />
    </g>

    <!-- Radar Telemetry Label -->
    <text x="0" y="145" text-anchor="middle" fill="#64748B" font-size="10" font-weight="600" class="mono-font" letter-spacing="2">ARCHETYPE: ARCHITECT</text>
  </g>

  <!-- Futuristic Corner Brackets -->
  <g stroke="#00F2FE" stroke-width="2.5" fill="none" opacity="0.7">
    <!-- Top-Left -->
    <path d="M 12 36 L 12 12 L 36 12" />
    <!-- Top-Right -->
    <path d="M 1164 12 L 1188 12 L 1188 36" />
    <!-- Bottom-Left -->
    <path d="M 12 344 L 12 368 L 36 368" />
    <!-- Bottom-Right -->
    <path d="M 1164 368 L 1188 368 L 1188 344" />
  </g>

  <!-- Subtle Scanline Passing Through -->
  <rect x="2" y="0" width="1196" height="30" fill="url(#radarGlow)" opacity="0.3" class="scan-beam" />
</svg>
